name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q install.py uninstall.py skills
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill
        run: >-
          python skills/codex-provider-session-sync/scripts/validate_skill.py
          skills/codex-provider-session-sync
